name: CI

# Runs on every pull request and on pushes to main.
#
# Why this exists: the only build check used to be Vercel, which runs *after* a
# merge to main. A type error therefore surfaced as a failed production deploy
# rather than a blocked PR, and production silently served a stale build for
# days. These checks run before merge so that cannot happen again.

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking. This is the check that would have caught the `never` collapse
      # that broke production.
      - name: Typecheck
        run: npx tsc --noEmit

      # Blocking.
      - name: Test
        run: npm test

      # Blocking. The old error backlog (no-explicit-any etc.) has been cleared;
      # `eslint` is clean, so lint now gates merges like the other checks.
      - name: Lint
        run: npm run lint
